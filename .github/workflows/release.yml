name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, notarize, and publish
    runs-on: macos-26
    timeout-minutes: 45

    env:
      APP_NAME: Kompakt
      PROJECT_PATH: Kompakt.xcodeproj
      SCHEME: Kompakt
      CONFIGURATION: Release
      ARCHIVE_PATH: build/Kompakt.xcarchive
      EXPORT_PATH: build/export
      KEYCHAIN_NAME: signing.keychain-db
      KEYCHAIN_PASSWORD: temporary-ci-keychain-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Fetch optimizer helpers
        run: |
          ./Scripts/fetch-oxipng.sh
          ./Scripts/fetch-webp-tools.sh
          ./Scripts/fetch-svgo-tool.sh
          ./Scripts/fetch-optimizer-tools.sh
          ./Scripts/fetch-ffmpeg-tools.sh

      - name: Verify bundled optimizer tools
        run: ./Scripts/verify-bundled-tools.sh

      - name: Validate release secrets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail

          test -n "$SPARKLE_PUBLIC_ED_KEY"
          test -n "$SPARKLE_PRIVATE_ED_KEY"

      - name: Run tests
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          xcodebuild test \
            -scheme "$SCHEME" \
            -project "$PROJECT_PATH" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            SPARKLE_PUBLIC_ED_KEY="${SPARKLE_PUBLIC_ED_KEY:-local-development-key}"

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p build
          KEYCHAIN_PATH="$RUNNER_TEMP/$KEYCHAIN_NAME"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          printf '%s' "$MACOS_CERTIFICATE_P12" > build/certificate.p12.base64
          base64 -D -i build/certificate.p12.base64 -o build/certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import build/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Archive app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail

          xcodebuild archive \
            -scheme "$SCHEME" \
            -project "$PROJECT_PATH" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SPARKLE_PUBLIC_ED_KEY="${SPARKLE_PUBLIC_ED_KEY:-local-development-key}"

      - name: Prepare export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          sed "s/\$(APPLE_TEAM_ID)/$APPLE_TEAM_ID/g" \
            Config/DeveloperIDExportOptions.plist > build/ExportOptions.plist

      - name: Export signed app
        run: |
          set -euo pipefail

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath "$EXPORT_PATH"

      - name: Verify code signature
        run: |
          set -euo pipefail

          codesign --verify --deep --strict --verbose=2 "$EXPORT_PATH/$APP_NAME.app"
          spctl --assess --type execute --verbose=2 "$EXPORT_PATH/$APP_NAME.app" || true

      - name: Create notarization zip
        run: |
          set -euo pipefail

          ditto -c -k --keepParent "$EXPORT_PATH/$APP_NAME.app" "build/$APP_NAME-notarization.zip"

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          xcrun notarytool submit "build/$APP_NAME-notarization.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Staple notarization ticket
        run: |
          set -euo pipefail

          xcrun stapler staple "$EXPORT_PATH/$APP_NAME.app"
          xcrun stapler validate "$EXPORT_PATH/$APP_NAME.app"

      - name: Create release zip
        run: |
          set -euo pipefail

          ditto -c -k --keepParent "$EXPORT_PATH/$APP_NAME.app" "build/$APP_NAME.zip"
          shasum -a 256 "build/$APP_NAME.zip" > "build/$APP_NAME.zip.sha256"

      - name: Create release DMG
        run: |
          set -euo pipefail

          ./Scripts/create-dmg.sh "$EXPORT_PATH/$APP_NAME.app" "build/$APP_NAME.dmg"

      - name: Notarize release DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          xcrun notarytool submit "build/$APP_NAME.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "build/$APP_NAME.dmg"
          xcrun stapler validate "build/$APP_NAME.dmg"
          shasum -a 256 "build/$APP_NAME.dmg" > "build/$APP_NAME.dmg.sha256"

      - name: Publish Sparkle appcast
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add build/pages origin/gh-pages
          else
            mkdir -p build/pages
            git worktree add --detach build/pages
          fi

          versioned_zip="$APP_NAME-${GITHUB_REF_NAME}.zip"
          cp "build/$APP_NAME.zip" "build/pages/$versioned_zip"
          cat > "build/pages/$APP_NAME-${GITHUB_REF_NAME}.md" <<EOF
          # $APP_NAME $GITHUB_REF_NAME

          - Added SVG/GIF support
          - Right-click options for completed kompaktions
          - Fixed text color in light mode
          EOF

          generate_appcast="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast' -type f | head -n 1)"
          test -x "$generate_appcast"

          echo "$SPARKLE_PRIVATE_ED_KEY" | "$generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://edinabazi.github.io/Kompakt/" \
            --link "https://github.com/edinabazi/Kompakt" \
            build/pages

          cd build/pages
          git checkout -B gh-pages
          git add .
          git commit -m "Update Sparkle appcast for ${GITHUB_REF_NAME}"
          git push origin HEAD:gh-pages

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kompakt-release
          path: |
            build/Kompakt.dmg
            build/Kompakt.dmg.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release create "${GITHUB_REF_NAME}" \
            "build/$APP_NAME.dmg" \
            "build/$APP_NAME.dmg.sha256" \
            --title "$APP_NAME ${GITHUB_REF_NAME}" \
            --notes "$(cat <<'EOF'
          - Added SVG/GIF support
          - Right-click options for completed kompaktions
          - Fixed text color in light mode
          EOF
          )"

      - name: Delete temporary keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
